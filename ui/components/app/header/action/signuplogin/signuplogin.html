{{ define "prtl/header.action.signuplogin" }}

<section class="signuplogin-wrap">

    <input type="radio" name="signuplogin-btn-grp" id="id-login-btn" class="underlay-show-btn"
        onclick="toggleUnderlay('signuplogin-underlay', 1)">
    <input type="radio" name="signuplogin-btn-grp" id="id-signup-btn" class="underlay-show-btn"
        onclick="toggleUnderlay('signuplogin-underlay', 1)">

    <label for="id-login-btn" aria-label="Log In" class="icon" tabindex="0" title="Log in">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1em">
            <path
                d="M217.9 105.9L340.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L217.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1L32 320c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM352 416l64 0c17.7 0 32-14.3 32-32l0-256c0-17.7-14.3-32-32-32l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l64 0c53 0 96 43 96 96l0 256c0 53-43 96-96 96l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32z" />
        </svg>
    </label>

    <label for="id-signup-btn" aria-label="Sign Up" class="icon" tabindex="0" title="Sign up">
        <svg xmlns="http://www.w3.org/2000/svg" height="22.5px" viewBox="0 -960 960 960" width="23px" fill="#e8eaed">
            <path
                d="M360-120q-66 0-113-47t-47-113v-327q-35-13-57.5-43.5T120-720q0-50 35-85t85-35q50 0 85 35t35 85q0 39-22.5 69.5T280-607v327q0 33 23.5 56.5T360-200q33 0 56.5-23.5T440-280v-400q0-66 47-113t113-47q66 0 113 47t47 113v327q35 13 57.5 43.5T840-240q0 50-35 85t-85 35q-50 0-85-35t-35-85q0-39 22.5-70t57.5-43v-327q0-33-23.5-56.5T600-760q-33 0-56.5 23.5T520-680v400q0 66-47 113t-113 47ZM240-680q17 0 28.5-11.5T280-720q0-17-11.5-28.5T240-760q-17 0-28.5 11.5T200-720q0 17 11.5 28.5T240-680Zm480 480q17 0 28.5-11.5T760-240q0-17-11.5-28.5T720-280q-17 0-28.5 11.5T680-240q0 17 11.5 28.5T720-200ZM240-720Zm480 480Z" />
        </svg>
    </label>

</section>
{{ end }}

{{ define "prtl/header.action.signuplogin.widget" }}
<section class="signuplogin-widget-wrap">
    <input type="radio" name="signuplogin-btn-grp" id="id-signuplogin-close-btn" class="underlay-hide-btn"
        onclick="toggleUnderlay('signuplogin-underlay', 0)">
    <label for="id-signuplogin-close-btn" title="Close" class="underlay" data-name="signuplogin-underlay"></label>

    <div class="signuplogin-widget">
        <div class="signuplogin">
            <span class="signuplogin-brand">
                <a href="/" rel="noopener noreferrer" cntnt-src="/res/static/org/logo-wordmark-current-colr.svg"></a>
            </span>

            <div class="login-wrap">
                <span class="title">Log in</span>
                <form class="signuplogin-form" id="loginForm" method="post" action="/api/auth/login">
                    <div class="input-con">
                        <div class="input-title">
                            <span>Email</span>
                        </div>
                        <input type="text" name="email" id="loginEmail" autocomplete="username email" maxlength="254"
                            spellcheck="false" autocorrect="off" autocapitalize="off" required
                            placeholder="email or username">
                    </div>

                    <div class="input-con">
                        <div class="input-title"> <span>Password</span> <a href="#" tabindex="-1">Forgot password?</a>
                        </div>
                        <div class="input-field">
                            <input type="password" class="pw-input" name="password" id="loginPassword"
                                autocomplete="current-password" spellcheck="false" autocorrect="off"
                                autocapitalize="off" required placeholder="password">
                            <button type="button" title="Show Password" class="icon pw-toggle" tabindex="-1">
                                <svg class="pw-show-icon" xmlns="http://www.w3.org/2000/svg" height="24px"
                                    viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                                    <path
                                        d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z" />
                                </svg>
                                <svg class="pw-hide-icon" xmlns="http://www.w3.org/2000/svg" height="24px"
                                    viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                                    <path
                                        d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Zm319 93Zm-151 75Z" />
                                </svg>
                            </button>
                        </div>

                    </div>

                    <div>
                        <button type="submit" name="login_submit" class="signuplogin-submit-btn" tabindex="0">Log In</button>
                        <div class="input-title tosignuplogin">
                            <span>Don't have an account? <label for="id-signup-btn" aria-label="Sign Up">Sign
                                    up</label></span>
                        </div>
                    </div>
                </form>
            </div>


            <div class="signup-wrap">
                <span class="title">Sign up</span>
                <form class="signuplogin-form" id="signupForm" method="post" action="/api/auth/signup">

                    <div class="input-con">
                        <div class="input-title">
                            <span>Username</span>
                        </div>

                        <input type="text" name="username" id="signupUsername" autocomplete="username" maxlength="254"
                            spellcheck="false" autocorrect="off" autocapitalize="off" required placeholder="username">
                    </div>

                    <div class="input-con">
                        <div class="input-title">
                            <span>Email</span>
                        </div>

                        <input type="email" name="email" id="signupEmail" autocomplete="email" maxlength="254"
                            spellcheck="false" autocorrect="off" autocapitalize="off" required
                            placeholder="email@gmail.com">
                    </div>

                    <div class="input-con">
                        <div class="input-title">
                            <span>Password</span>
                        </div>
                        <div class="input-field">

                            <input type="password" class="pw-input" name="password" id="signupPassword"
                                autocomplete="new-password" spellcheck="false" autocorrect="off" autocapitalize="off"
                                aria-autocomplete="list" required placeholder="password" class="pw-input">
                            <button type="button" class="icon pw-toggle" tabindex="-1">
                                <svg class="pw-show-icon" xmlns="http://www.w3.org/2000/svg" height="24px"
                                    viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                                    <path
                                        d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z" />
                                </svg>
                                <svg class="pw-hide-icon" xmlns="http://www.w3.org/2000/svg" height="24px"
                                    viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                                    <path
                                        d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Zm319 93Zm-151 75Z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- <div class="input-con">
                        <div class="input-title">
                            <span>Confirm Password</span>
                        </div>
                        <input type="password" name="confirm_password" id="signupConfirmPassword"
                            autocomplete="new-password" spellcheck="false" autocorrect="off" autocapitalize="off"
                            required placeholder="confirm password">
                    </div> -->

                    <div>
                        <button type="submit" name="signupSubmit" class="signuplogin-submit-btn" tabindex="0"
                            aria-label="Submit Signup">Sign Up</button>
                        <div class="input-title tosignuplogin">
                            <span>Already have an account? <label for="id-login-btn" aria-label="Log In">Log in</label>
                            </span>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
</section>
{{ end }}
